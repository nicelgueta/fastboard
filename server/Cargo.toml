[package]
name = "fastboard-server"
version = "0.1.0"
edition = "2021"
description = "Serves the built FastBoard app and a Reddit search SSE stream"
license = "MIT"

[dependencies]
async-stream = "0.3"
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
